name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pdfplumber python-docx pyyaml colorama openpyxl tqdm

      - name: Check syntax
        run: |
          python -m py_compile main.py
          python -m py_compile analyzer/extractor.py
          python -m py_compile analyzer/keyword_scan.py
          python -m py_compile analyzer/clause_scan.py
          python -m py_compile analyzer/metadata_scan.py
          python -m py_compile analyzer/comparator.py
          python -m py_compile analyzer/reporter.py
          python -m py_compile analyzer/sanitizer.py
          echo "All files compile successfully"